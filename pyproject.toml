[project]
name = "botkin"
version = "0.2.0"
description = "Dr.Botkin — Telegram-бот для парсинга медицинских документов через qwen3-vl"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.140.8,<0.141",
    "httpx==0.28.1",
    "pydantic>=2.13.4,<2.14",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.20,<0.1",
    "uvicorn[standard]>=0.34.0,<0.36",
    "aiogram>=3.30.0,<3.31",
    "openai>=1.0.0",
    "instructor>=1.15.4,<1.16",
    "tenacity>=8.2.0",
    "pymupdf>=1.27.2.3",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "plotly>=6.1.1,<7",
    "kaleido>=1.0,<2",
    "rapidfuzz==3.14.5",
    "pillow-heif>=1.3.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "garminconnect>=0.3.6",
    "sqlite-vec>=0.1.9",
    "fpdf2>=2.8.7",
    "minio>=7.2.20",
    "json-repair>=0.30.0",
    "dateparser>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<8.5",
    "pytest-asyncio>=1.4.0,<1.5",
    "ruff>=0.15.22,<0.16",
    "openpyxl>=3.1.5",
]

[project.scripts]
botkin-api = "botkin.api.app:app"
botkin-bot = "botkin.bot.main:run"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"
# По умолчанию e2e с реальной Ollama не гоняем: окружение без GPU (CI) иначе флапает.
# Запуск явно: `uv run pytest -m llm` (командный -m переопределяет этот фильтр).
addopts = "-m 'not llm and not reasoning'"
markers = [
    "llm: e2e-тесты, дёргающие реальную Ollama (авто-skip, если модель недоступна)",
    "reasoning: e2e-тесты medical reasoning через локальные uncensored LLM (авто-skip, если модель недоступна)",
]

[tool.ruff]
src = ["src"]
