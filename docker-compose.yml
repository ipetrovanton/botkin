# Docker Compose для Botkin: API + Telegram-бот + MinIO (S3-хранилище документов).
#
# Запуск:
#   docker compose up -d
#
# Ollama должна быть доступна по адресу OLLAMA_URL — либо на хосте,
# либо в отдельном контейнере (см. профиль ollama ниже).
#
# MinIO: http://localhost:9001 (консоль), ключи minioadmin/minioadmin.
# API:   http://localhost:8000
#
# Перед запуском скопируйте .env.example → .env и заполните TG_BOT_TOKEN.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    command: uv run uvicorn botkin.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources
      - ./config.json:/app/config.json:ro
    env_file: .env
    environment:
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: botkin-documents
      MINIO_SECURE: "0"
      SQLITE_PATH: /app/data/botkin.db
      SOURCES_DIR: /app/sources
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: uv run python -m botkin.bot.main
    env_file: .env
    environment:
      API_URL: http://api:8000
      SQLITE_PATH: /app/data/botkin.db
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  minio-data:
