# Локальный MinIO для хранилища оригиналов документов (этап 3).
# Запуск:  docker compose -f docker-compose.minio.yml up -d
# Консоль: http://localhost:9001 (логин/пароль ниже; поменяйте в проде).
# Включение в botkin: STORAGE_BACKEND=minio в .env (см. .env.example).
services:
  minio:
    image: minio/minio:latest
    container_name: botkin-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
