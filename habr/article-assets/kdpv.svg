<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f1c"/>
      <stop offset="1" stop-color="#081311"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2e2a"/>
      <stop offset="1" stop-color="#0a201c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="300" r="320" fill="url(#glow)"/>

  <!-- phone with a scanned lab form -->
  <g transform="translate(120,140)">
    <rect x="0" y="0" width="220" height="360" rx="28" fill="#0f2b26" stroke="#1c4d43" stroke-width="3"/>
    <rect x="16" y="30" width="188" height="300" rx="10" fill="#f2f7f4"/>
    <rect x="34" y="52" width="152" height="12" rx="3" fill="#0b1f1c" opacity="0.55"/>
    <rect x="34" y="78" width="100" height="8" rx="3" fill="#0b1f1c" opacity="0.35"/>
    <g fill="#0b1f1c" opacity="0.28">
      <rect x="34" y="108" width="152" height="6" rx="2"/>
      <rect x="34" y="124" width="152" height="6" rx="2"/>
      <rect x="34" y="140" width="110" height="6" rx="2"/>
      <rect x="34" y="164" width="152" height="6" rx="2"/>
      <rect x="34" y="180" width="152" height="6" rx="2"/>
      <rect x="34" y="196" width="90" height="6" rx="2"/>
      <rect x="34" y="220" width="152" height="6" rx="2"/>
      <rect x="34" y="236" width="130" height="6" rx="2"/>
    </g>
    <circle cx="110" cy="352" r="6" fill="#1c4d43"/>
  </g>

  <!-- arrow 1: phone -> chip -->
  <g stroke="#4fd1c5" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 360 300 L 470 300" />
    <path d="M 455 288 L 470 300 L 455 312" />
  </g>

  <!-- GPU chip, local processing -->
  <g transform="translate(490,180)">
    <rect x="0" y="0" width="220" height="240" rx="18" fill="url(#chip)" stroke="#2dd4bf" stroke-width="2"/>
    <g stroke="#2dd4bf" stroke-width="3" opacity="0.8">
      <line x1="-14" y1="40" x2="0" y2="40"/>
      <line x1="-14" y1="90" x2="0" y2="90"/>
      <line x1="-14" y1="140" x2="0" y2="140"/>
      <line x1="-14" y1="190" x2="0" y2="190"/>
      <line x1="220" y1="40" x2="234" y2="40"/>
      <line x1="220" y1="90" x2="234" y2="90"/>
      <line x1="220" y1="140" x2="234" y2="140"/>
      <line x1="220" y1="190" x2="234" y2="190"/>
    </g>
    <rect x="24" y="24" width="172" height="192" rx="10" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
    <!-- heartbeat / reference-corridor motif -->
    <polyline points="40,120 78,120 96,72 116,168 136,96 156,120 196,120"
              fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="116" cy="168" r="6" fill="#34d399"/>
    <text x="110" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7fe4d6">qwen3-vl · Ollama</text>
  </g>

  <!-- arrow 2: chip -> card -->
  <g stroke="#4fd1c5" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 740 300 L 850 300" />
    <path d="M 835 288 L 850 300 L 835 312" />
  </g>

  <!-- structured result card -->
  <g transform="translate(870,150)">
    <rect x="0" y="0" width="230" height="280" rx="16" fill="#f2f7f4"/>
    <rect x="0" y="0" width="230" height="280" rx="16" fill="none" stroke="#0f2b26" stroke-width="0"/>
    <rect x="22" y="26" width="120" height="14" rx="4" fill="#0b1f1c" opacity="0.75"/>
    <rect x="22" y="50" width="80" height="9" rx="3" fill="#0b1f1c" opacity="0.4"/>
    <line x1="22" y1="78" x2="208" y2="78" stroke="#0b1f1c" stroke-opacity="0.12" stroke-width="1.5"/>

    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0b1f1c">
      <text x="22" y="102" opacity="0.7">Гемоглобин</text>
      <rect x="150" y="90" width="58" height="14" rx="7" fill="#e7f5ee"/>
      <circle cx="180" cy="97" r="4" fill="#34d399"/>

      <text x="22" y="134" opacity="0.7">Мочевая кислота</text>
      <rect x="150" y="122" width="58" height="14" rx="7" fill="#fdecec"/>
      <circle cx="196" cy="129" r="4" fill="#f0564a"/>

      <text x="22" y="166" opacity="0.7">Лимфоциты</text>
      <rect x="150" y="154" width="58" height="14" rx="7" fill="#fdf3e3"/>
      <circle cx="192" cy="161" r="4" fill="#f5a623"/>
    </g>

    <line x1="22" y1="188" x2="208" y2="188" stroke="#0b1f1c" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="22" y="206" width="186" height="10" rx="5" fill="#0b1f1c" opacity="0.08"/>
    <rect x="22" y="206" width="112" height="10" rx="5" fill="#2dd4bf" opacity="0.55"/>
    <text x="22" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0b1f1c" opacity="0.55">SQLite · только на этой машине</text>
  </g>

  <!-- crossed-out cloud, top right corner: nothing leaves the machine -->
  <g transform="translate(1050,60)" opacity="0.9">
    <path d="M0,20 a14,14 0 0 1 6,-27 a20,20 0 0 1 38,-2 a16,16 0 0 1 4,31 z"
          fill="none" stroke="#7fe4d6" stroke-width="3"/>
    <line x1="-10" y1="-8" x2="58" y2="42" stroke="#f0564a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
