<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#f2f7f4"/>
  <line x1="600" y1="30" x2="600" y2="490" stroke="#0b1f1c" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="8 10"/>

  <!-- panel 1 -->
  <text x="300" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1f1c">Шаг 1</text>
  <text x="300" y="98" text-anchor="middle" font-size="15" fill="#5b6b66">Сфотографировать бланк анализа</text>
  <circle cx="230" cy="290" r="70" fill="none" stroke="#0b1f1c" stroke-width="5"/>
  <circle cx="380" cy="290" r="70" fill="none" stroke="#0b1f1c" stroke-width="5"/>
  <text x="300" y="440" text-anchor="middle" font-size="14" fill="#8a978f">(две простые операции)</text>

  <!-- panel 2 -->
  <text x="900" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1f1c">Шаг 2</text>
  <text x="900" y="98" text-anchor="middle" font-size="15" fill="#5b6b66">Получить структурированные данные</text>

  <g transform="translate(900,300)" stroke="#0b1f1c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- owl body -->
    <ellipse cx="0" cy="20" rx="95" ry="115" fill="#fdf3e3" stroke="#0b1f1c"/>
    <!-- ear tufts -->
    <path d="M -60,-90 L -40,-40 L -80,-55 Z" fill="#0b1f1c" stroke="none"/>
    <path d="M 60,-90 L 40,-40 L 80,-55 Z" fill="#0b1f1c" stroke="none"/>
    <!-- eyes -->
    <circle cx="-38" cy="-10" r="34" fill="#f2f7f4"/>
    <circle cx="38" cy="-10" r="34" fill="#f2f7f4"/>
    <circle cx="-38" cy="-10" r="34" fill="none"/>
    <circle cx="38" cy="-10" r="34" fill="none"/>
    <circle cx="-32" cy="-6" r="11" fill="#0b1f1c" stroke="none"/>
    <circle cx="32" cy="-6" r="11" fill="#0b1f1c" stroke="none"/>
    <!-- beak -->
    <path d="M -10,26 L 10,26 L 0,44 Z" fill="#f5a623" stroke="none"/>
    <!-- wings -->
    <path d="M -92,40 C -120,70 -110,110 -80,128"/>
    <path d="M 92,40 C 120,70 110,110 80,128"/>
    <!-- feet -->
    <path d="M -24,132 L -30,150 M -24,132 L -18,150 M -24,132 L -24,152"/>
    <path d="M 24,132 L 18,150 M 24,132 L 30,150 M 24,132 L 24,152"/>
    <!-- belly feather lines -->
    <path d="M -30,60 Q 0,72 30,60" stroke-width="3" opacity="0.5"/>
    <path d="M -34,84 Q 0,98 34,84" stroke-width="3" opacity="0.5"/>
  </g>

  <text x="900" y="475" text-anchor="middle" font-size="14" fill="#8a978f">(вся сложность спрятана между шагами)</text>
</svg>
